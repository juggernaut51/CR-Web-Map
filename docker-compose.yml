services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-crmap}
      POSTGRES_PASSWORD: ${POSTGRES_PASS:-crmap_secret}
      POSTGRES_DB: ${POSTGRES_DB:-crmap}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-crmap}"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    restart: unless-stopped
    command: npm run dev
    ports:
      - "5000:5000"
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 5000
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-crmap}
      POSTGRES_PASS: ${POSTGRES_PASS:-crmap_secret}
      POSTGRES_DB: ${POSTGRES_DB:-crmap}
      SESSION_SECRET: ${SESSION_SECRET:-dev-secret-keep-it-long}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin}
      POSTGRES_SSL: "false"
      SEED_FROM_JSON: "true"
      COOKIE_SECURE: "false"

volumes:
  pgdata:
